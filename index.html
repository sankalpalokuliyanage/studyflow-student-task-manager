const seed=[['자료구조 문제 세트 완성하기','컴퓨터공학',0,'high','과제'],['세포 호흡 노트 복습하기','생명과학',0,'medium','학습 세션'],['연구 에세이 서론 초안 작성하기','영어',0,'high','프로젝트'],['5장 연습 문제 풀기','수학',1,'medium','과제'],['논문 3번 읽고 주석 달기','심리학',3,'low','읽기'],['실험 2 보고서 완성하기','화학',5,'high','과제']].map((x,i)=>({id:101+i,title:x[0],subject:x[1],date:plus(x[2]),priority:x[3],type:x[4],time:'18:00',duration:'60분',reminder:'30분 전',notes:'',completed:false,created:6-i}));seed.push({id:107,title:'미적분 워크시트 제출하기',subject:'수학',date:plus(-1),priority:'medium',type:'과제',time:'15:00',duration:'30분',reminder:'없음',notes:'',completed:true,created:0});let tasks;try{tasks=JSON.parse(localStorage.getItem('studyflow_v3_ko'))||seed}catch{tasks=seed}let view='all',tab='all',editing=null;const save=()=>localStorage.setItem('studyflow_v3_ko',JSON.stringify(tasks)),esc=s=>{let d=document.createElement('div');d.textContent=s||'';return d.innerHTML},label=s=>{let d=new Date(s+'T00:00:00'),n=Math.round((d-today)/864e5);return n===0?'오늘':n===1?'내일':n===-1?'어제':d.toLocaleDateString('ko-KR',{month:'short',day:'numeric'})};
function filtered(){let q=$('#search').value.toLowerCase(),sub=$('#subject').value,sort=$('#sort').value,rank={high:0,medium:1,low:2},a=tasks.filter(t=>{let d=new Date(t.date+'T00:00:00'),v=view==='all'||view==='subjects'||view==='calendar'||view==='today'&&t.date===iso(today)||view==='upcoming'&&d>today&&!t.completed||view==='completed'&&t.completed,tt=tab==='all'||tab==='todo'&&!t.completed||tab==='progress'&&!t.completed&&t.date===iso(today)||tab==='completed'&&t.completed;return v&&tt&&(sub==='all'||sub===t.subject)&&(t.title.toLowerCase().includes(q)||t.subject.toLowerCase().includes(q))});return a.sort((a,b)=>sort==='priority'?rank[a.priority]-rank[b.priority]:sort==='newest'?b.created-a.created:a.completed-b.completed||a.date.localeCompare(b.date))}
function render(){let cur=$('#subject').value,$sub=[...new Set(tasks.map(t=>t.subject))].sort();$('#subject').innerHTML='<option value="all">전체 과목</option>'+$sub.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');let list=filtered(),done=tasks.filter(t=>t.completed).length,todayTasks=tasks.filter(t=>t.date===iso(today)&&!t.completed),high=tasks.filter(t=>t.priority==='high'&&!t.completed).length,pct=tasks.length?Math.round(done/tasks.length*100):0;$('#allCount').textContent=tasks.length;$('#todayCount').textContent=todayTasks.length;$('#due').textContent=todayTasks.length;$('#high').textContent=high;$('#done').textContent=done;$('#outof').textContent=`전체 ${tasks.length}개 중`;$('#summary').textContent=`전체 ${tasks.length}개 중 ${done}개 완료`;$('#percent').textContent=pct+'%';$('#tabAll').textContent=`(${tasks.length})`;$('#tabTodo').textContent=`(${tasks.filter(t=>!t.completed).length})`;$('#tabDone').textContent=`(${done})`;$('#focusList').innerHTML=todayTasks.slice(0,3).map(t=>`<label class="focus-row"><input class="check" type="checkbox" onchange="toggle(${t.id})">${esc(t.title)}</label>`).join('')||'<span class="focus-row">오늘의 집중 과제를 모두 마쳤어요.</span>';$('#chart').innerHTML=[75,50,62,92,68,32,Math.max(10,pct)].map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${v}%"></div><span>${['월','화','수','목','금','토','일'][i]}</span></div>`).join('');$('#heading').textContent={all:'전체 과제',today:'오늘의 과제',upcoming:'예정된 과제',completed:'완료한 과제',subjects:'과목별 과제',calendar:'과제 캘린더'}[view];const priorityLabel={high:'높음',medium:'보통',low:'낮음'};$('#list').innerHTML=list.length?list.map(t=>`<article class="task-row ${t.completed?'done':''}"><input class="check" type="checkbox" ${t.completed?'checked':''} onchange="toggle(${t.id})" aria-label="${esc(t.title)} 완료 표시"><div class="task-name">${esc(t.title)}</div><span class="badge">${esc(t.subject)}</span><span class="due ${t.date===iso(today)?'today':''}">${cal}${label(t.date)}</span><span class="priority ${t.priority}">${flag}${priorityLabel[t.priority]}</span><div class="actions"><button class="icon-btn" onclick="editTask(${t.id})" aria-label="과제 수정">${edit}</button><button class="icon-btn" onclick="removeTask(${t.id})" aria-label="과제 삭제">${trash}</button></div></article>`).join(''):'<div class="empty"><strong>표시할 과제가 없어요</strong>새 과제를 추가하거나 잠시 여유를 즐겨 보세요.</div>'}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1700)}function openModal(t=null){editing=t?.id||null;$('#modalHeading').textContent=t?'과제 수정':'새 과제 추가';$('#submit').textContent=t?'변경 사항 저장':'과제 만들기';$('#title').value=t?.title||'';$('#course').value=t?.subject||'';$('#taskDate').value=t?.date||iso(today);$('#time').value=t?.time||'18:00';$(`input[name=priority][value=${t?.priority||'medium'}]`).checked=true;$('#type').value=t?.type||'과제';$('#duration').value=t?.duration||'60분';$('#reminder').value=t?.reminder||'30분 전';$('#notes').value=t?.notes||'';$('#dialog').showModal();setTimeout(()=>$('#title').focus(),30)}window.toggle=id=>{let t=tasks.find(x=>x.id===id);t.completed=!t.completed;save();render();toast(t.completed?'과제를 완료했어요. 정말 잘했어요!':'과제를 다시 열었어요')};window.editTask=id=>openModal(tasks.find(x=>x.id===id));window.removeTask=id=>{tasks=tasks.filter(x=>x.id!==id);save();render();toast('과제를 삭제했어요')};
$('#form').onsubmit=e=>{e.preventDefault();let data={title:$('#title').value.trim(),subject:$('#course').value.trim(),date:$('#taskDate').value,time:$('#time').value,priority:$('input[name=priority]:checked').value,type:$('#type').value,duration:$('#duration').value,reminder:$('#reminder').value,notes:$('#notes').value.trim()};if(!data.title||!data.subject||!data.date)return;if(editing)Object.assign(tasks.find(t=>t.id===editing),data);else tasks.push({id:Date.now(),...data,completed:false,created:Date.now()});save();$('#dialog').close();render();toast(editing?'과제를 수정했어요':'새 과제를 만들었어요')};$('#add').onclick=()=>openModal();$('#close').onclick=$('#cancel').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()};$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));render()});$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});['search','subject','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#date').textContent=today.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});render();
</script></body></html>
